; Root-level PlatformIO configuration for the Colloquy of Mobiles monorepo.
;
; The firmware source lives in firmware/ but the PlatformIO VS Code extension
; expects platformio.ini at the workspace root. This file redirects all the
; standard PlatformIO directories into the firmware/ subfolder so that the
; extension's "Upload", "Monitor", and "Build" buttons work from here.
;
; The canonical copy of all settings lives in firmware/platformio.ini.
; Keep both files in sync when adding libraries or changing build options.

[platformio]
src_dir     = firmware/src
include_dir = firmware/include
lib_dir     = firmware/lib
test_dir    = firmware/test
; Store build artifacts alongside the firmware source, not at the workspace root.
build_dir   = firmware/.pio/build
libdeps_dir = firmware/.pio/libdeps

[env:adafruit_feather_esp32_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
lib_deps =
	madhephaestus/ESP32Servo@^3.0.5
	adafruit/Adafruit GFX Library@^1.11.10
	adafruit/Adafruit SSD1306@^2.5.13
	h2zero/NimBLE-Arduino@^1.4.2
monitor_speed = 115200
monitor_filters = time
